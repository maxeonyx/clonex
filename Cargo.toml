[package]
name = "clonex"
version = "0.1.0"
edition = "2021"
description = "Composable Git histories: repositories that contain other repositories' real histories"
license = "MIT OR Apache-2.0"

[[bin]]
name = "clonex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[workspace]
